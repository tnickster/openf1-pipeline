version: 2

models:
  - name: dim_drivers
    columns:
      - name: driver_number
        tests:
          - not_null
          - unique
      - name: session_key
        tests:
          - not_null
      - name: meeting_key
        tests:
          - not_null

  - name: fct_race_replay
    columns:
      - name: driver_number
        tests:
          - not_null
      - name: session_key
        tests:
          - not_null
      - name: date
        tests:
          - not_null

  - name: fct_laps
    columns:
      - name: driver_number
        tests:
          - not_null
      - name: lap_number
        tests:
          - not_null
      - name: session_key
        tests:
          - not_null

  - name: fct_starting_grid
    columns:
      - name: driver_number
        tests:
          - not_null
      - name: position
        tests:
          - not_null
      - name: session_key
        tests:
          - not_null